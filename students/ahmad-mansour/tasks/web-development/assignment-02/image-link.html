<!DOCTYPE html>
<html>
<head>
    <title>Image Link</title>
    <!-- Favicon link -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <!-- Clickable image link -->
    <a href="https://www.google.com">
        <img src="google_logo.jpg" alt="Search using Google" width="200">
    </a>
</body>
</html>
